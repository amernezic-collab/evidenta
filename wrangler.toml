name = "evidenta"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# keep variables set in the dashboard (ACCESS_AUD) when deploying from GitHub
keep_vars = true
# only app.evidenta.io (behind Cloudflare Access)
workers_dev = false
preview_urls = false

# fonts and logo embedded into invoice PDFs
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.png"]
fallthrough = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "evidenta"
database_id = "2733b011-104c-4707-857d-ee7481d21829"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "evidenta-files"
jurisdiction = "eu"

[vars]
ACCESS_TEAM_DOMAIN = "old-hat-7f0d.cloudflareaccess.com"
# ACCESS_AUD = "set after creating the Access application"
